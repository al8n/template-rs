version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 50

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Weekly, like cargo above: the updates arrive as one pull request, and a pull request runs
      # every workflow. An action's update is rarely urgent, and security updates do not wait for
      # this schedule.
      interval: "weekly"
    groups:
      # Every action in one pull request, the pinned ones in release.yml and deny.yml included.
      actions:
        patterns:
          - "*"
